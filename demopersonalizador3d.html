              >Clave de distribuidor:</label
            >
            <input
              type="password"
              id="clave-distribuidor"
              name="clave-distribuidor"
              required
            />
            <label for="cantidad-unidades">Cantidad:</label>
            <input
              type="number"
              id="cantidad-unidades"
              name="cantidad-unidades"
              min="1"
              value="1"
              required
            />
            <label for="detalles-pedido">Detalles especiales del pedido:</label>
            <textarea
              id="detalles-pedido"
              name="detalles-pedido"
              rows="3"
              placeholder="Indique aquí cualquier detalle especial..."
            ></textarea>

            <h2>Datos del cliente para la entrega:</h2>
            <label for="nombre-cliente">Nombre:</label>
            <input
              type="text"
              id="nombre-cliente"
              name="nombre-cliente"
              required
            />

            <label for="direccion-envio">Dirección de envío:</label>
            <input
              type="text"
              id="direccion-envio"
              name="direccion-envio"
              required
            />

            <label for="telefono-cliente">Teléfono:</label>
            <input
              type="tel"
              id="telefono-cliente"
              name="telefono-cliente"
              required
            />

            <h2>Formalizar</h2>
            <button type="submit">Realizar pedido</button>
            <button type="button" id="cerrar-modal" style="margin-left: 10px">
              Cancelar
            </button>
          </form>
        </div>
      </div>
      <button onclick="downloadCanvasImage()" hidden>Descargar imagen</button>
