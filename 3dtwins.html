<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3dtwins</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: sans-serif;
      color: white;
    }

    #hero {
      width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    .hero-text {
      position: absolute;
      text-align: center;
      z-index: 2;
    }

    .hero-text h1 {
 font-family: "Inter", sans-serif;
  margin: 30px;
  font-size: 7.9rem;
  background: linear-gradient(90deg, #00ffe7, #ff00cc, #00ffe7);
  background-size: 250% auto;
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
  animation: shine 3s linear infinite;
  font-weight: 800;
    }

    .hero-text p {
      font-size: 1.5rem;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="hero">
    <div class="hero-text">
      <h1>3D TWINS</h1>
      <p>Herramientas 3D para gemelos digitales</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

  <script>
    let scene, camera, renderer, torus, particles, hover = false;
    const originalPositions = [];
    const tempPositions = [];

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById("hero").appendChild(renderer.domElement);

      const geometry = new THREE.TorusGeometry(1.2, 0.4, 32, 200);
      const material = new THREE.PointsMaterial({
        color: 0xff6800,
        size: 0.02
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Guardamos posiciones originales
      const pos = particles.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);
        originalPositions.push(new THREE.Vector3(x, y, z));
        tempPositions.push(new THREE.Vector3(x, y, z));
      }

      // Eventos hover
      const hero = document.getElementById("hero");
      hero.addEventListener("mouseenter", () => hover = true);
      hero.addEventListener("mouseleave", () => hover = false);

      window.addEventListener("resize", onWindowResize, false);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      particles.rotation.x += 0.002;
      particles.rotation.y += 0.003;

      const pos = particles.geometry.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        const orig = originalPositions[i];
        const temp = tempPositions[i];

        if (hover) {
          // Dispersar
          temp.x += (Math.random() - 0.5) * 0.02;
          temp.y += (Math.random() - 0.5) * 0.02;
          temp.z += (Math.random() - 0.5) * 0.02;
        } else {
          // Volver a posición original suavemente
          temp.lerp(orig, 0.05);
        }

        pos.setXYZ(i, temp.x, temp.y, temp.z);
      }

      pos.needsUpdate = true;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
