<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Moléculas Interactivas 3d twins steam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0d0d1a;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    #ui {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0,0,0,0.6);
      padding: 1rem;
      border-radius: 8px;
      color: white;
      z-index: 10;
      max-height: 95vh;
      overflow-y: auto;
      width: 180px;
    }

    #ui h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    #ui button {
      display: block;
      margin-bottom: 0.5rem;
      width: 100%;
      padding: 0.5rem;
      background: #222;
      border: 1px solid #555;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }

    #ui button:hover {
      background: #444;
    }

    #moleculeContainer {
      width: 100%;
      height: 100vh;
    }

    canvas {
      display: block;
    }

    /* Nuevo contenedor de descripción */
    #descriptionBox {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      max-width: 320px;
      background: rgba(0,0,0,0.7);
      color: #eee;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.3;
      z-index: 10;
      pointer-events: none; /* para que no interfiera con interacciones */
      user-select: none;
      font-family: 'Arial', sans-serif;
      box-shadow: 0 0 10px #000;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Elige una molécula</h2>
    <button onclick="loadMolecule('h2o')">Agua (H₂O)</button>
    <button onclick="loadMolecule('co2')">Dióxido de carbono (CO₂)</button>
    <button onclick="loadMolecule('ch4')">Metano (CH₄)</button>

    <!-- 20 moléculas nuevas -->
    <button onclick="loadMolecule('nh3')">Amoníaco (NH₃)</button>
    <button onclick="loadMolecule('o2')">Oxígeno (O₂)</button>
    <button onclick="loadMolecule('n2')">Nitrógeno (N₂)</button>
    <button onclick="loadMolecule('h2')">Hidrógeno (H₂)</button>
    <button onclick="loadMolecule('c2h6')">Etano (C₂H₆)</button>
    <button onclick="loadMolecule('c2h4')">Etileno (C₂H₄)</button>
    <button onclick="loadMolecule('c2h2')">Acetileno (C₂H₂)</button>
    <button onclick="loadMolecule('ch3oh')">Metanol (CH₃OH)</button>
    <button onclick="loadMolecule('ch3ch2oh')">Etanol (C₂H₅OH)</button>
    <button onclick="loadMolecule('h2so4')">Ácido sulfúrico (H₂SO₄)</button>
    <button onclick="loadMolecule('hcl')">Ácido clorhídrico (HCl)</button>
    <button onclick="loadMolecule('ch4cl2')">Diclorometano (CH₂Cl₂)</button>
    <button onclick="loadMolecule('c6h6')">Benceno (C₆H₆)</button>
    <button onclick="loadMolecule('co')">Monóxido de carbono (CO)</button>
    <button onclick="loadMolecule('no2')">Dióxido de nitrógeno (NO₂)</button>
    <button onclick="loadMolecule('n2o')">Óxido nitroso (N₂O)</button>
    <button onclick="loadMolecule('c6h12')">Ciclohexano (C₆H₁₂)</button>
    <button onclick="loadMolecule('ch3nh2')">Metilamina (CH₃NH₂)</button>
    <button onclick="loadMolecule('h2o2')">Peróxido de hidrógeno (H₂O₂)</button>
    <button onclick="loadMolecule('nh4cl')">Cloruro de amonio (NH₄Cl)</button>
