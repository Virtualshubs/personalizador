<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>3DTWINS Ecosistema con Componente Social y Huertos</title>
<style>
  body, html { margin: 0; padding: 0; overflow: hidden; background: #0b1120; color: white; font-family: Arial, sans-serif; }
  #container { width: 100vw; height: 100vh; }
  #ui {
    position: absolute; top: 1rem; left: 1rem;
    background: rgba(0,0,0,0.6); padding: 1rem; border-radius: 8px;
    max-width: 350px;
    user-select: none;
    z-index: 10;
  }
  button { margin-top: 0.5rem; padding: 0.5rem; width: 100%; cursor: pointer; font-weight: bold; }
  .stat-row {
    margin: 0.3rem 0;
    font-size: 0.9rem;
  }
  #registroCivil {
    position: absolute; top: 1rem; right: 1rem;
    background: rgba(0,0,0,0.7); padding: 1rem; border-radius: 8px;
    width: 320px; max-height: 90vh; overflow-y: auto; font-size: 0.85rem;
    z-index: 10;
  }
  .tumba, .nacimiento {
    border-bottom: 1px solid #555; margin-bottom: 0.5rem; padding-bottom: 0.4rem;
  }
  .titulo {
    font-weight: bold;
    margin-bottom: 0.3rem;
  }
 .tag {
      position: absolute;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 2px 6px;
      font-size: 12px;
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
    }

  /* --- Modal --- */
  #modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex; justify-content: center; align-items: center;
    z-index: 100;
  }
  #modalContent {
    background: #1a1a2e; padding: 2rem; border-radius: 12px;
    text-align: center; max-width: 420px; color: #fff;
  }
  #modalContent h2 { margin-bottom: 1rem; }
  #modalContent .modal-btn {
    width: auto; margin: 0.5rem; padding: 0.7rem 1.2rem; font-size: 1rem;
    cursor: pointer;
  }

  /* Open control small button */
  #openControl {
    position: absolute; top: 1rem; left: 50%; transform: translateX(-50%);
    z-index: 110; background: rgba(255,255,255,0.06); color: #fff;
    border-radius: 6px; padding: 6px 10px; border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="container"></div>

  <div id="ui">
    <h2>Ecosistema Social</h2>
    <div class="stat-row">Año simulado: <span id="yearCount">0</span></div>
    <div class="stat-row">Población total: <span id="popCount">0</span></div>
    <div class="stat-row">Plantas totales: <span id="plantCount">0</span></div>
    <div class="stat-row">Pares con huerto: <span id="pairsCount">0</span></div>
    <div class="stat-row">Árboles plantados (total): <span id="totalTreesCount">0</span></div>
    <button id="btnToggleSim">Pausar</button>
  </div>

  <button id="openControl">Abrir Control</button>

  <div id="registroCivil">
    <h3>Registro Civil</h3>
    <div><strong>Nacimientos recientes</strong></div>
    <div id="registroNacimientos"></div>
    <div style="margin-top: 1rem;"><strong>Tumbas</strong></div>
    <div id="registroTumbas"></div>
  </div>

  <!-- Modal -->
  <div id="modal">
    <div id="modalContent">
      <h2>🌱 Bienvenido al Ecosistema Social</h2>
      <p>Controla el estado de la simulación:</p>
      <div style="margin-top:1rem;">
        <button id="btnStart" class="modal-btn">Start</button>
        <button id="btnPause" class="modal-btn">Pause</button>
        <button id="btnRestart" class="modal-btn">Restart</button>
      </div>
      <p style="margin-top:1rem; font-size: 0.85rem; color: #ccc;">Puedes volver a abrir este panel con "Abrir Control".</p>
    </div>
  </div>
