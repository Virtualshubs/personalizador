<style>body {
  margin: 10;
  font-family: "Orbitron", sans-serif;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Input de carga de modelo */
#modelLoader input {
  display: block;
  margin: 5px 0;
}

/* Contenedor principal del visor */
#container {
  width: 100vw;
  height: 55vh;
}

/* Caja de respuesta */
#responseBox {
  z-index: 1000;
  padding: 0.9rem 0.75rem;
  background: #ffffff;
  border-radius: 6px;
  box-shadow: none;
  font-size: 0.9rem;
  color: #333333;
  border: 1px solid #dddddd;
  display: none;
  margin: 30px;
}

/* Contenedor de chat */
#chat-container {
  border: 1px solid #143152;
    border-radius: 26px;
  top: 200px;
  right: 10px;
  position: fixed;
  max-width: 220px;
    height:100vh;
  padding: 30px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scale: 0.8;
    max-height: 50vh; /* o cualquier altura deseada */
  overflow-y: auto;
  scrollbar-width: thin; /* Estilo del scroll en Firefox */
  scrollbar-color: #00ffea transparent;
}

/* Mensajes del bot */
.bot-message {
  background: rgba(0, 0, 0, 0.6);
  color: #00ffea;
  padding: 12px 16px;
  border-radius: 20px;
  max-width: 80%;
  box-shadow: 0 0 10px rgba(0, 255, 234, 0.6);
  backdrop-filter: blur(8px);
  align-self: flex-start;
  animation: appear 0.3s ease-out;
}

/* Animación */
@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Input del usuario */
#userInput {
  z-index: 1010;
  padding: 0.2rem;
  margin: 10px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  border-radius: 16px;
  border: 1px solid #dddddd;
  color: black;
}

/* Botón de inicio */
#startBtn {
  z-index: 1000;
  margin-left: 20px;
  padding: 10px;
  background-color: white;
  color: black;
  border: 1px solid #dddddd;
  cursor: pointer;
  border-radius: 16px;
}

#startBtn:hover {
  background-color: #143152;
  color: white;
}

/* Contenedor de modelos */
#contenedor-modelos {
  z-index: 1010;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

/* Estilo individual del modelo */
.modelo-gafa {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
  width: 200px;
}

.modelo-gafa h3 {
  font-size: 16px;
  margin-bottom: 10px;
}

.modelo-gafa iframe {
  margin-bottom: 10px;
  max-width: 100%;
}

/* ======= MEDIA QUERIES PARA MÓVILES ======= */
@media (max-width: 600px) {
  #container {
    height: 40vh;
  }

  #userInput {
    width: 90%;
    font-size: 0.8rem;
  }

  #startBtn {
    margin-left: 0;
    width: 90%;
    font-size: 1rem;
  }

  #chat-container {
    right: 5px;
    top: auto;
    bottom: 10px;
    scale: 0.8;
    max-width: 95vw;
    padding: 10px;
  }

  .bot-message {
    max-width: 85%;
    font-size: 0.85rem;
  }

  #contenedor-modelos {
    flex-direction: column;
    align-items: center;
  }

  .modelo-gafa {
    width: 80%;
  }
}
</style>
